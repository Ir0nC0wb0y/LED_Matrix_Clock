; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;[env:nodemcuv2]
;platform = espressif8266
;board = nodemcuv2
;framework = arduino

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.filesystem = littlefs  ; Critical: sets the filesystem type

monitor_speed = 115200
upload_speed = 115200

lib_deps = 
	;FastLED=https://github.com/FastLED/FastLED.git
	fastled/FastLED@^3.10.3
	DS3232RTC=https://github.com/PaulStoffregen/DS3232RTC.git
	Timezone=https://github.com/JChristensen/Timezone.git
	NTP=https://github.com/sstaub/NTP.git